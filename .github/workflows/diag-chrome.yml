name: diag-chrome
on:
  push:
    branches: ['diag/epsilon-148-chrome']
jobs:
  first:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fullenv, homeenv]
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: |
          cat /etc/os-release | head -2; ls -la /var/cache/fontconfig | head -5; du -sh /usr/share/fonts; fc-list | wc -l
      - run: node scripts/diag-chrome.mjs ${{ matrix.variant }} 3
