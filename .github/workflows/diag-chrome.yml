name: diag-chrome
on:
  push:
    branches: ['diag/epsilon-148-chrome']
jobs:
  io:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: |
          d=$(dirname "$(readlink -f "$(which google-chrome)")"); du -sh "$d"
          s=$(date +%s%N); find "$d" -type f -exec cat {} + > /dev/null; echo "cold read of $d: $(( ($(date +%s%N)-s)/1000000 ))ms"
          s=$(date +%s%N); find "$d" -type f -exec cat {} + > /dev/null; echo "warm read of $d: $(( ($(date +%s%N)-s)/1000000 ))ms"
      - run: node scripts/diag-chrome.mjs fullenv 2
