name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that touches a database runs on Supabase's own local stack: production's server
  # build (PostgreSQL 17, pinned in supabase/config.toml), Supabase's anon / authenticated /
  # service_role with their real grants, and PostgREST. There is no second engine: the Vitest
  # database tests used to run on in-process PGlite (18.6, another driver), and migrations on a
  # separate postgres:17 service; neither was the thing production runs.
  #
  # CLI pin: v3 is a prerelease (3.1.0-beta.26) and is the only line that ships a PostgreSQL 17
  # local image; stable 2.x tops out at 15.8 while production runs 17.11. Move this to the first
  # stable v3 and delete the pin comment.
  check:
    runs-on: ubuntu-latest

    env:
      SUPABASE_CLI_VERSION: 3.1.0-beta.26
      # Placeholders so build-time env validation passes. No real secrets in CI.
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm db:check

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start the Supabase stack
        run: supabase start
      # DATABASE_URL is the stack's own database, which PostgREST serves; the Vitest database tests
      # copy a template they build next to it on the same server (src/lib/server/test-db.global.ts).
      - name: Point at the stack
        run: |
          db=$(supabase status --output json | jq -r .DB_URL)
          echo "DATABASE_URL=$db" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$db" >> "$GITHUB_ENV"

      # Migrate the stack's own database first: the test template is then compared grant for grant
      # with it, so a template that drifts from Supabase's real privileges stops the run.
      - name: Apply migrations on the Supabase stack
        id: migrate
        run: pnpm db:migrate
      - name: Migration ledger matches the repo journal
        run: pnpm db:drift
      - name: PostgreSQL major agrees across README, Supabase config and the live server
        run: pnpm db:pgversion

      # The audio contract is checked against AudioKit's openapi.yaml (contract.drift.test.ts).
      # Source: the AUDIOKIT_OPENAPI_URL variable (https://<audiokit host>/v1/openapi.yaml) once
      # AudioKit is hosted, else the audiokit repo with the read-only AUDIOKIT_READ_TOKEN secret.
      - name: Fetch AudioKit's contract
        env:
          AUDIOKIT_OPENAPI_URL: ${{ vars.AUDIOKIT_OPENAPI_URL }}
          AUDIOKIT_READ_TOKEN: ${{ secrets.AUDIOKIT_READ_TOKEN }}
        run: |
          out="$RUNNER_TEMP/audiokit-openapi.yaml"
          if [ -n "$AUDIOKIT_OPENAPI_URL" ]; then
            curl -fsSL "$AUDIOKIT_OPENAPI_URL" -o "$out"
          elif [ -n "$AUDIOKIT_READ_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $AUDIOKIT_READ_TOKEN" -H "Accept: application/vnd.github.raw" \
              https://api.github.com/repos/epsilon-records/audiokit/contents/openapi.yaml -o "$out"
          else
            echo "::warning::No AUDIOKIT_OPENAPI_URL or AUDIOKIT_READ_TOKEN; the contract drift test will fail"
            exit 0
          fi
          echo "AUDIOKIT_OPENAPI=$out" >> "$GITHUB_ENV"
      - run: pnpm test

      # RLS in the stack's own database (SQL) and through PostgREST, the layer a browser uses.
      # `pnpm test` runs the SQL cases too, in a template copy; this is the database Supabase set up.
      - name: RLS through SQL
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: pnpm test:rls
      - name: RLS through PostgREST
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: pnpm test:rls:rest

      - name: Browser privacy and aggregate readback (real Supabase, installed Chrome)
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        env:
          METRICS_PROOF_PATH: ${{ runner.temp }}/app-metrics-proof.json
        run: node scripts/app-metrics-browser-db.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: app-metrics-proof
          path: ${{ runner.temp }}/app-metrics-proof.json
          if-no-files-found: ignore

      # Creates a Sentry release and uploads source maps for this commit
      # (skipped when the secret is absent, e.g. forks).
      - run: pnpm build
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}

      - name: Stop the stack
        if: always()
        run: supabase stop

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the full history for committed keys, tokens and passwords.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose

  # Shared UI components (EPSILON-166): every story renders in Chromium and passes the
  # accessibility checks, and the static Storybook builds. No database needed.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm build-storybook
