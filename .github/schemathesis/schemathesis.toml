# Schemathesis settings for .github/workflows/api-fuzz.yml. The API key is generated per run by the
# workflow and only ever exists on the runner.

# The four checks the job runs: no server error, every status code and content type documented,
# and every response matching its schema.
[checks]
enabled = false
not_a_server_error.enabled = true
status_code_conformance.enabled = true
content_type_conformance.enabled = true
response_schema_conformance.enabled = true

[auth.openapi.apiKey]
bearer = "${LABELKIT_FUZZ_API_KEY}"

# The coverage phase also tries each path with methods the spec doesn't list. TRACE is left out:
# `vite preview`, which serves the build here, crashes on it (Node's Request refuses the method),
# and in production Netlify's runtime never passes TRACE to the app.
[phases.coverage]
unexpected-methods = ["get", "put", "post", "delete", "options", "patch", "query"]

# The document is served as `application/yaml` and the spec types it `{ type: string }`. Schemathesis
# parses a YAML body into an object before it checks the schema, so a string schema never matches.
# The body is the spec itself, which src/lib/server/api/openapi.test.ts already checks.
[[operations]]
include-operation-id = "getOpenapi"
checks.response_schema_conformance.enabled = false
