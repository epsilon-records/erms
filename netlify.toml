[build]
  command = "pnpm build"
  publish = "build"
  # Each production deploy costs 15 Free-plan credits (shared 0048): skip a build when a commit
  # only touches the Storybook site (its own Netlify site, shared 0061). An uncached build (equal
  # refs) always builds.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)storybook-site'"

[build.environment]
  NODE_VERSION = "22"
  # R2 account IDs are public endpoint identifiers, not credentials.
  SECRETS_SCAN_OMIT_KEYS = "R2_ACCOUNT_ID"

# Static assets don't pass through the SvelteKit server, so they get the same headers here.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

