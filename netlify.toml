[build]
  command = "pnpm build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  # R2 account IDs are public endpoint identifiers, not credentials.
  SECRETS_SCAN_OMIT_KEYS = "R2_ACCOUNT_ID"

# Static assets don't pass through the SvelteKit server, so they get the same headers here.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
