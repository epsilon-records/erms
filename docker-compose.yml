# Local Postgres for development. Production uses Supabase (Postgres, Auth, Storage).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: erms
      POSTGRES_PASSWORD: erms
      POSTGRES_DB: erms
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
