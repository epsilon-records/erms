# Local development services. Production uses Supabase (Postgres + Storage).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: erms
      POSTGRES_PASSWORD: erms
      POSTGRES_DB: erms
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erms
      MINIO_ROOT_PASSWORD: erms-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
