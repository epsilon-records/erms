# The storybook.labelkit.co Netlify site (shared 0061). Its base directory is storybook-site/,
# so Netlify reads this file instead of the app's netlify.toml. Storybook is built from the repo
# root and published here.
[build]
  command = "cd .. && corepack enable && pnpm install --frozen-lockfile && pnpm build-storybook -o storybook-site/dist"
  publish = "dist"
  # Each production deploy costs 15 Free-plan credits: only build when the UI or Storybook changed.
  # On a site's first build Netlify sets CACHED_COMMIT_REF to COMMIT_REF, which would make the diff
  # empty and skip it forever, so equal refs always build.
  ignore = "test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ../src/lib/components/ui ../src/lib/utils.ts ../src/app.css ../src/tailwind.css ../vite.config.ts ../.storybook ../package.json ../pnpm-lock.yaml ."

[build.environment]
  NODE_VERSION = "22"
  # The shared soft gate (shared 0047) isn't a credential worth failing builds over.
  SECRETS_SCAN_OMIT_KEYS = "STORYBOOK_PASSWORD"

[[edge_functions]]
  path = "/*"
  function = "storybook"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"
