# The storybook.labelkit.co Netlify site (shared 0061), public since shared 0062, composed by the hub (0064). Its base
# directory is storybook-site/, so Netlify reads this file instead of the app's netlify.toml.
# Storybook is built from the repo root and published here.
[build]
  command = "cd .. && corepack enable && pnpm install --frozen-lockfile && pnpm build-storybook -o storybook-site/dist"
  publish = "dist"
  # Each production deploy costs 15 Free-plan credits: only build when the UI or Storybook changed.
  # An uncached build (the site's first, or after "clear cache") has CACHED_COMMIT_REF equal to
  # COMMIT_REF, so the diff alone is always empty and the build was always skipped: the site
  # never published and storybook.labelkit.co served Netlify's 404. Build in that case.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ../src/lib ../src/app.css ../src/tailwind.css ../vite.config.ts ../.storybook ../package.json ../pnpm-lock.yaml ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"
    # The hub at storybook.epsilonrecords.com composes this Storybook (shared 0064).
    Access-Control-Allow-Origin = "https://storybook.epsilonrecords.com"
