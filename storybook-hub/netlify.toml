# The storybook.epsilonrecords.com hub (Netlify site epsilon-storybook, shared 0064 and 0065). Its
# base directory is storybook-hub/. It only composes the products' Storybooks, so it rebuilds only
# when this folder or the Storybook version changes (15 Free-plan credits per production deploy).
[build]
  command = "cd .. && corepack enable && pnpm install --frozen-lockfile && pnpm exec storybook build -c storybook-hub/.storybook -o storybook-hub/dist"
  publish = "dist"
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../package.json ../pnpm-lock.yaml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"
